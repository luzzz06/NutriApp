{% extends "base.html" %}
{% block title %}Analizador{% endblock %}
{% block content %}
<h4>Analizador de Recetas</h4>
<form method="POST">
  <div class="mb-3"><label>Ingresa tu receta:</label><textarea name="receta" class="form-control" required></textarea></div>
  <button class="btn btn-warning">Analizar</button>
</form>
{% if resultado %}
<div class="alert alert-success mt-3">{{ resultado }}</div>
{% endif %}
{% endblock %}
