{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h3 class="text-center mb-4">Peso Corporal Ideal</h3>
  <form method="post" class="mx-auto" style="max-width:400px;">
    <div class="mb-3">
      <label class="form-label">Altura (cm):</label>
      <input type="number" name="altura" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Sexo:</label>
      <select name="sexo" class="form-select" required>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>
    </div>
    <button class="btn btn-warning w-100">Calcular</button>
  </form>

  {% if resultado %}
  <div class="alert alert-info text-center mt-4">{{ resultado }}</div>
  {% endif %}
</div>
{% endblock %}
