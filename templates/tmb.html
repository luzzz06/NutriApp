{% extends "base.html" %}
{% block title %}TMB{% endblock %}
{% block contenido %}
<h4>Tasa Metabólica Basal</h4>
<form method="POST">
  <div class="mb-3"><label>Peso (kg):</label><input name="peso" type="number" step="0.1" class="form-control" required></div>
  <div class="mb-3"><label>Altura (cm):</label><input name="altura" type="number" class="form-control" required></div>
  <div class="mb-3"><label>Edad:</label><input name="edad" type="number" class="form-control" required></div>
  <div class="mb-3">
    <label>Sexo:</label>
    <select name="sexo" class="form-select" required>
      <option>Masculino</option>
      <option>Femenino</option>
    </select>
  </div>
  <button class="btn btn-warning">Calcular</button>
</form>
{% if resultado %}
<div class="alert alert-success mt-3">{{ resultado }}</div>
{% endif %}
{% endblock %}
