{% extends "base.html" %}
{% block title %}GCT{% endblock %}
{% block contenido %}
<h4>Gasto Calórico Total</h4>
<form method="POST">
  <div class="mb-3"><label>TMB (kcal):</label><input name="tmb" type="number" step="0.1" class="form-control" required></div>
  <div class="mb-3"><label>Factor de Actividad:</label><input name="actividad" type="number" step="0.01" class="form-control" required></div>
  <button class="btn btn-warning">Calcular</button>
</form>
{% if resultado %}
<div class="alert alert-success mt-3">{{ resultado }}</div>
{% endif %}
{% endblock %}
