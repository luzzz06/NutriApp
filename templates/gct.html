{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h3 class="text-center mb-4">Gasto Calórico Total (GCT)</h3>
  <form method="post" class="mx-auto" style="max-width:400px;">
    <div class="mb-3">
      <label class="form-label">TMB (kcal/día):</label>
      <input type="number" step="0.1" name="tmb" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nivel de actividad:</label>
      <select name="actividad" class="form-select" required>
        <option value="1.2">Sedentario</option>
        <option value="1.375">Ligero</option>
        <option value="1.55">Moderado</option>
        <option value="1.725">Activo</option>
        <option value="1.9">Muy activo</option>
      </select>
    </div>
    <button class="btn btn-warning w-100">Calcular</button>
  </form>

  {% if resultado %}
  <div class="alert alert-info text-center mt-4">{{ resultado }}</div>
  {% endif %}
</div>
{% endblock %}
